<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CysRank · 多肽设计</title>
<style>
:root{
  color-scheme:light;
  --ink:#3c4148;
  --muted:#606b79;
  --line:#c5cdd5;
  --primary:#1e467e;
  --primary-hover:#163761;
  --blue:#4275b5;
  --background:#f1f6fa;
  --surface:#fff;
  --soft-blue:#e8f0f8;
  --input-background:#f8fbfd;
  --input-line:#aebfd1;
  --accent:#c00000;
  --accent-background:#fff0f0;
  --accent-line:#e7bcbc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--ink);font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:20px max(6vw,24px);display:flex;justify-content:space-between;align-items:center}
header b{font-size:23px;letter-spacing:-1px;color:var(--primary)}
header span{font-size:13px;color:var(--muted)}
main{max-width:1080px;margin:54px auto;padding:0 24px}
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--primary)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.3;margin:12px 0;color:var(--primary)}
p{color:var(--muted)}
.flow{display:flex;gap:18px;flex-wrap:wrap;margin:28px 0 34px;font-size:13px;color:var(--muted)}
.flow strong{color:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:22px}
label{font-weight:650;display:block;margin-bottom:10px}
textarea{display:block;width:100%;min-height:130px;resize:vertical;border:1px solid var(--input-line);border-radius:10px;padding:17px;font:19px/1.7 ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--ink);background:var(--input-background)}
textarea::placeholder{color:var(--muted);opacity:1}
textarea:focus{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:16px}
.small{font-size:13px;color:var(--muted)}
button,.download{border:0;border-radius:9px;padding:12px 22px;background:var(--primary);color:var(--surface);font:600 14px system-ui;text-decoration:none;cursor:pointer;display:inline-block}
button:enabled:hover,.download:hover{background:var(--primary-hover)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.55;cursor:wait}
.error{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:22px;min-width:0}
.card h3{margin:0;font-size:15px;color:var(--primary)}
.sequence{overflow-wrap:anywhere;font:19px/1.8 ui-monospace,monospace;letter-spacing:1px;margin:22px 0}
mark{background:var(--accent-background);color:var(--accent);border-radius:3px;padding:2px}
.score{font-size:30px;font-weight:650;margin:10px 0;color:var(--primary)}
.badge{font-size:12px;color:var(--primary);background:var(--soft-blue);border-radius:20px;padding:4px 10px}
.warn{background:var(--accent-background);border:1px solid var(--accent-line);padding:12px;border-radius:9px;color:var(--accent);font-size:13px}
.links{display:flex;gap:16px;margin-top:18px}
.links a{color:var(--primary);font-size:13px}
.links a:hover{color:var(--primary-hover)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
h2{font-size:22px;color:var(--primary)}
footer{margin:35px 0;color:var(--muted);font-size:12px}
@media(max-width:760px){main{margin-top:30px}.cards{grid-template-columns:1fr}.panel{padding:20px}header span{display:none}}
</style>
<header><b>环化智造 Cyclic Intelligence</b></header>
<main><h1>输入一条多肽，探索新的 Cys 位点。</h1>
<p>枚举每个插入位置，自动预测候选结构，输出排名最高的三条新序列。</p>
<div class="flow"><strong>01 输入目标序列</strong><span>→ 02 预测候选结构</span><span>→ 03 获取 Top3</span><span>→ 04 导出外部评估</span></div>
<form id="form" class="panel"><label for="sequence">目标多肽序列</label><textarea id="sequence" name="sequence" placeholder="在这里粘贴多肽序列，例如 AGKSTV · 上限100个残基" required spellcheck="false" aria-describedby="hint"></textarea>
<div class="row"><div id="hint" class="small"><span id="count"></span></div><button id="submit">开始预测</button></div><p id="error" class="error" role="alert" hidden></p></form>
<section id="progress" class="panel" aria-live="polite" hidden><b id="status">正在准备…</b><p class="small">首次运行需加载结构模型，CPU 预测可能需要较长时间。输入内容和运行日志会保留在本次任务中。</p><details><summary class="small">查看运行详情</summary><pre id="log"></pre></details><button type="button" id="retry" hidden>重新连接任务</button></section>
<section id="results" hidden><div class="row"><h2>推荐序列 <span class="small">/ TOP 3</span></h2><a id="bundle" class="download">下载外部评估包</a></div><p id="summary" class="small"></p><div id="cards" class="cards"></div><p class="small">优先展示通过过滤的候选；不足三条时按内部评分补足，并明确提示风险。模型分数用于排序，不代表实验成功概率。</p></section>
</main>
<script>
const $=id=>document.getElementById(id);let maxLength=100,active=null,timer=null;
const normalized=()=>$('sequence').value.replace(/\s/g,'').toUpperCase();
$('sequence').addEventListener('input',()=>{const n=normalized().length;$('count').textContent=n?`${n} 个残基 · ${n+1} 个插入位置`:'';});
$('sequence').addEventListener('keydown',event=>{if(event.key!=='Enter'||event.isComposing)return;event.preventDefault();if(!event.repeat&&!$('submit').disabled)$('form').requestSubmit();});
function error(message){$('error').textContent=message;$('error').hidden=false;}
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function render(data){$('results').hidden=false;$('cards').replaceChildren();const s=data.summary;$('summary').textContent=`已枚举 ${s.candidate_count} 个位置，完成 ${s.scored_count} 个位点评分。展示 ${data.top3.length} 条不同序列，其中 ${s.fallback_count} 条为补足候选。`;if(data.top3.length<3)$('summary').textContent+=' 可评分的不同序列不足三条，已展示全部可用结果。';
 $('bundle').href=`/downloads/${data.id}/external_evaluation.zip`;
 for(const r of data.top3){const card=element('article',undefined,'card');card.append(element('h3',`候选 ${String(r.rank).padStart(2,'0')}`),element('span',r.selection_status==='fallback'?'补足候选 · 请留意提示':'通过过滤','badge'));const seq=element('div',undefined,'sequence'),i=r.inserted_position_1based-1;seq.append(document.createTextNode(r.sequence.slice(0,i)),element('mark','C'),document.createTextNode(r.sequence.slice(i+1)));card.append(seq,element('div',`新增 Cys：第 ${i+1} 位`,'small'),element('div',r.prediction_score.toFixed(4),'score'),element('div','模型排序分数','small'));if(r.warning)card.append(element('p',r.warning,'warn'));const links=element('div',undefined,'links');for(const [label,path] of [['下载结构',r.structure_file],['查看报告','report.md']]){const a=element('a',label);a.href=`/downloads/${data.id}/results/${path}`;links.append(a);}card.append(links);$('cards').append(card);}}
async function poll(){clearTimeout(timer);try{const response=await fetch(`/api/jobs/${active}`);const data=await response.json();if(!response.ok){if(response.status===404){active=null;localStorage.removeItem('cysrank-active');$('submit').disabled=false;}throw Error(data.error);}$('log').textContent=data.log||'正在准备…';$('retry').hidden=true;
 if(data.status==='running'){$('status').textContent='正在预测候选结构与评分…';timer=setTimeout(poll,2000);return;}
 $('submit').disabled=false;localStorage.removeItem('cysrank-active');if(data.status==='failed'){$('status').textContent='预测未完成';error(data.error||'预测失败。请展开运行详情检查模型下载、依赖或内存信息，然后重新提交。');return;}$('status').textContent='预测完成 · 已生成外部评估包';render(data);
 }catch(e){error(e.message);$('status').textContent=active?'任务连接中断，结果状态尚未确认':'任务已失效，可以重新提交序列';$('retry').hidden=!active;}}
$('retry').onclick=()=>{if(active){$('error').hidden=true;poll();}};
$('form').onsubmit=async event=>{event.preventDefault();$('error').hidden=true;const sequence=normalized();if(!/^[ACDEFGHIKLMNPQRSTVWY]{2,}$/.test(sequence))return error('请输入至少两个标准氨基酸，仅接受 20 种标准单字母代码。');if(sequence.length>maxLength)return error(`当前最多支持 ${maxLength} 个残基。`);$('submit').disabled=true;$('results').hidden=true;try{const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sequence})});const data=await response.json();if(!response.ok)throw Error(data.error);active=data.id;localStorage.setItem('cysrank-active',active);localStorage.setItem('cysrank-sequence',sequence);$('progress').hidden=false;$('log').textContent='';poll();}catch(e){error(e.message);$('submit').disabled=false;}};
fetch('/api/config').then(r=>r.json()).then(c=>{maxLength=c.max_length;$('sequence').placeholder=`在这里粘贴多肽序列，例如 AGKSTV · 上限${maxLength}个残基`;}).catch(()=>{});
$('sequence').value=localStorage.getItem('cysrank-sequence')||'';$('sequence').dispatchEvent(new Event('input'));active=localStorage.getItem('cysrank-active');if(active){$('progress').hidden=false;$('submit').disabled=true;poll();}
</script></html>
